# Netlify Configuration for Vite + React SPA
[build]
  command = "npm run build"
  publish = "dist"

# Redirect all requests to index.html for Client-Side Routing (SPA)
[[redirects]]
  from = "/*"
  to = "/index.html"
  status = 200

# Cache static assets for high performance
[[headers]]
  for = "/assets/*"
  [headers.values]
    Cache-Control = "public, max-age=31536000, immutable"

[[headers]]
  for = "/favicon.svg"
  [headers.values]
    Cache-Control = "public, max-age=86400"

