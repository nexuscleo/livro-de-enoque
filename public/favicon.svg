<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 100 100" width="100%" height="100%">
    <defs>
        <radialGradient id="bgGrad" cx="50%" cy="50%" r="50%">
            <stop offset="0%" stop-color="#0a1d3a" />
            <stop offset="100%" stop-color="#030712" />
        </radialGradient>
        <filter id="goldGlow" x="-20%" y="-20%" width="140%" height="140%">
            <feGaussianBlur stdDeviation="1.5" result="blur" />
            <feComposite in="SourceGraphic" in2="blur" operator="over" />
        </filter>
    </defs>
    <rect width="100" height="100" rx="20" fill="url(#bgGrad)" />
    <circle cx="50" cy="50" r="44" stroke="#ffd700" stroke-width="1.5" fill="none" opacity="0.4" />
    <circle cx="50" cy="50" r="40" stroke="#ffd700" stroke-width="1.2" stroke-dasharray="2 2" fill="none" filter="url(#goldGlow)" />
    <!-- Sacred Hexagram & Enochian Seal Geometry -->
    <polygon points="50,12 83,70 17,70" stroke="#ffd700" stroke-width="1.8" fill="none" filter="url(#goldGlow)" />
    <polygon points="50,88 83,30 17,30" stroke="#ffd700" stroke-width="1.8" fill="none" filter="url(#goldGlow)" />
    <circle cx="50" cy="50" r="14" stroke="#38bdf8" stroke-width="1.5" fill="none" />
    <circle cx="50" cy="50" r="4" fill="#ffd700" filter="url(#goldGlow)" />
</svg>
